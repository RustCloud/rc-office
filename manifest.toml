id = "rc-office"
version = "0.2.1"
# The version of wit/app.wit: open_with, tokens, locks, request bodies and
# addresses from settings need 0.2.14, [[proxy]] and proxy.self-url 0.2.15.
api = "^0.2.15"
# PutFile of a document larger than the plugin takes at once: the server
# keeps the body on disk and the plugin saves it with write-request-body.
large_bodies = true

[name]
en = "Office"
ru = "Офис"

# The plugin is a WOPI host over the user's files: Collabora Online (a
# container next to the server, `office_url`) opens and saves the one file the
# user opened, with a token for it. Versions, quota, the activity log and the
# trash stay the server's.
[permissions]
files = "opened"
files_write = true
# Discovery and capabilities of Collabora.
network = ["{office_url}"]

# Browsers reach Collabora only through the server's address: its pages and
# scripts (/browser) and the document's WebSocket (/cool). So Collabora needs
# no address, port or TLS of its own.
[[proxy]]
target = "{office_url}"
paths = ["/browser", "/cool"]

[[server_settings]]
key = "office_url"
kind = "text"
label.en = "Collabora Online address (inside)"
label.ru = "Адрес Collabora Online (внутренний)"
hint.en = "As this server reaches it, e.g. http://collabora:9980. Browsers reach Collabora through the cloud's address"
hint.ru = "Как до неё достаёт сервер облака, например http://collabora:9980. Браузеры ходят к Collabora через адрес облака"

[[server_settings]]
key = "wopi_base_url"
kind = "text"
label.en = "Address of THIS cloud for Collabora (usually empty)"
label.ru = "Адрес ЭТОГО облака для Collabora (обычно пусто)"
hint.en = "Empty: the server finds it itself. Only if Collabora reaches the cloud at another address, e.g. http://rustcloud:8080. Not the address of Collabora!"
hint.ru = "Пусто — сервер определяет сам. Только если Collabora достаёт облако по другому адресу, например http://rustcloud:8080. Не адрес Collabora!"

[[open_with]]
mime = [
  "application/vnd.oasis.opendocument.text",
  "application/vnd.oasis.opendocument.spreadsheet",
  "application/vnd.oasis.opendocument.presentation",
  "application/vnd.oasis.opendocument.graphics",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  "application/msword",
  "application/vnd.ms-excel",
  "application/vnd.ms-powerpoint",
  "application/rtf",
  "text/csv",
]
page = "/edit"
write = true
layout = "full"
label = { en = "Edit in Office", ru = "Редактировать в Офисе" }

[ui]
icon = "file"
entry = "/app/rc-office"
